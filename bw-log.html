<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>白黒ログ</title>
<style>
  :root{
    --ink:#14181c;
    --surface:#1c2227;
    --surface-2:#242b31;
    --paper:#eee9df;
    --paper-dim:#a8a49a;
    --brass:#c79a5c;
    --brass-dim:#8a713f;
    --rose:#c07a72;
    --line:#333c42;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    line-height:1.6;
    padding:0 0 60px;
    min-height:100vh;
  }
  main{
    max-width:520px;
    margin:0 auto;
    padding:20px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    margin-bottom:16px;
  }
  .field{margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}
  label.field-label{
    display:block;
    font-size:13px;
    color:var(--paper-dim);
    margin-bottom:8px;
  }
  input[type=text]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    color:var(--paper);
    font-size:15px;
  }
  input[type=text]:focus{outline:1px solid var(--brass);}
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--paper);
    padding:8px 13px;
    border-radius:20px;
    font-size:13.5px;
    cursor:pointer;
    user-select:none;
    transition:background .15s, border-color .15s;
  }
  .chip.selected{
    background:var(--brass);
    border-color:var(--brass);
    color:var(--ink);
    font-weight:600;
  }
  textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    color:var(--paper);
    font-size:14px;
    resize:vertical;
    min-height:44px;
    font-family:inherit;
  }
  .score-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  input[type=range]{
    flex:1;
    accent-color:var(--brass);
  }
  .score-num{
    font-family:Georgia,serif;
    font-size:22px;
    min-width:44px;
    text-align:right;
    color:var(--brass);
  }
  button.save{
    width:100%;
    background:var(--brass);
    color:var(--ink);
    border:none;
    border-radius:8px;
    padding:14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:4px;
  }
  button.save:active{background:var(--brass-dim);}
  .saved-label{
    text-align:center;
    color:var(--brass);
    font-size:13px;
    margin-top:10px;
    min-height:16px;
  }
  button.analyze{
    width:100%;
    background:var(--surface-2);
    color:var(--paper);
    border:1px solid var(--brass-dim);
    border-radius:8px;
    padding:12px;
    font-size:14px;
    cursor:pointer;
  }
  button.analyze:active{background:var(--line);}
  button.analyze:disabled{opacity:.5;cursor:default;}
  #analyzeResult{
    margin-top:14px;
    font-size:14px;
    line-height:1.8;
    white-space:pre-wrap;
    color:var(--paper);
  }
  #analyzeResult.loading{
    color:var(--paper-dim);
    font-style:italic;
  }
  #analyzeResult.error{
    color:var(--rose);
  }
</style>
</head>
<body>

<main>

  <div class="card">
    <div class="field">
      <label class="field-label">① 状況</label>
      <input type="text" id="situation">
    </div>

    <div class="field">
      <label class="field-label">② 浮かんだ感覚（複数選択可）</label>
      <div class="chips" id="chips">
        <div class="chip" data-v="落胆">落胆</div>
        <div class="chip" data-v="開き直り">開き直り</div>
        <div class="chip" data-v="諦念">諦念</div>
        <div class="chip" data-v="慣れ">慣れ</div>
        <div class="chip" data-v="ストレス">ストレス</div>
        <div class="chip" data-v="暇">暇</div>
        <div class="chip" data-v="対人関係">対人関係</div>
        <div class="chip" data-v="楽観">楽観</div>
      </div>
    </div>

    <div class="field">
      <label class="field-label">補足（任意）</label>
      <textarea id="note"></textarea>
    </div>

    <div class="field">
      <label class="field-label">③ 思った直後の点数</label>
      <div class="score-row">
        <input type="range" id="scoreFirst" min="0" max="100" value="20">
        <div class="score-num" id="scoreFirstNum">20</div>
      </div>
    </div>

    <div class="field">
      <label class="field-label">④ 本当の点数</label>
      <div class="score-row">
        <input type="range" id="scoreReal" min="0" max="100" value="60">
        <div class="score-num" id="scoreRealNum">60</div>
      </div>
    </div>

    <div class="field">
      <label class="field-label">⑤ これからどうするか</label>
      <input type="text" id="nextAction">
    </div>

    <button class="save" id="saveBtn">記録する</button>
    <div class="saved-label" id="savedLabel"></div>
  </div>

  <div class="card">
    <label class="field-label">Claudeに分析してもらう</label>
    <button class="analyze" id="analyzeBtn">パターンを分析する</button>
    <div id="analyzeResult"></div>
  </div>

</main>

<script>
  const KEY = 'bwlog_entries_v1';

  const chipsEl = document.getElementById('chips');
  const selected = new Set();
  chipsEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const v = chip.dataset.v;
      if (selected.has(v)) { selected.delete(v); chip.classList.remove('selected'); }
      else { selected.add(v); chip.classList.add('selected'); }
    });
  });

  const scoreFirstEl = document.getElementById('scoreFirst');
  const scoreFirstNum = document.getElementById('scoreFirstNum');
  scoreFirstEl.addEventListener('input', () => scoreFirstNum.textContent = scoreFirstEl.value);

  const scoreRealEl = document.getElementById('scoreReal');
  const scoreRealNum = document.getElementById('scoreRealNum');
  scoreRealEl.addEventListener('input', () => scoreRealNum.textContent = scoreRealEl.value);

  function loadEntries(){
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch(e){ return []; }
  }
  function saveEntries(list){
    localStorage.setItem(KEY, JSON.stringify(list));
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const saveBtn = document.getElementById('saveBtn');
  const savedLabel = document.getElementById('savedLabel');

  saveBtn.addEventListener('click', () => {
    const situation = document.getElementById('situation').value.trim();
    const note = document.getElementById('note').value.trim();
    const scoreFirst = parseInt(scoreFirstEl.value, 10);
    const scoreReal = parseInt(scoreRealEl.value, 10);
    const nextAction = document.getElementById('nextAction').value.trim();

    const entry = {
      date: new Date().toISOString(),
      situation,
      tags: Array.from(selected),
      note,
      scoreFirst,
      scoreReal,
      nextAction
    };

    const list = loadEntries();
    list.push(entry);
    saveEntries(list);

    // reset form
    document.getElementById('situation').value = '';
    document.getElementById('note').value = '';
    document.getElementById('nextAction').value = '';
    selected.clear();
    chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
    scoreFirstEl.value = 20;
    scoreFirstNum.textContent = 20;
    scoreRealEl.value = 60;
    scoreRealNum.textContent = 60;

    savedLabel.textContent = '記録したでやんす';
    setTimeout(() => savedLabel.textContent = '', 1800);
  });

  const analyzeBtn = document.getElementById('analyzeBtn');
  const analyzeResult = document.getElementById('analyzeResult');

  analyzeBtn.addEventListener('click', async () => {
    const entries = loadEntries();

    if (!entries.length){
      analyzeResult.className = 'error';
      analyzeResult.textContent = 'まだ記録がないでやんす。';
      return;
    }

    analyzeBtn.disabled = true;
    analyzeResult.className = 'loading';
    analyzeResult.textContent = '分析中でやんす…';

    const dataForPrompt = entries.map(e => ({
      日時: e.date,
      状況: e.situation,
      感覚: e.tags,
      補足: e.note,
      直後の点数: e.scoreFirst,
      本当の点数: e.scoreReal,
      これからどうするか: e.nextAction
    }));

    const systemPrompt = `あなたは認知行動療法（CBT）と依存症の再発防止モデルに詳しいカウンセラーです。
以下はユーザーが「白黒思考ログ」として記録した、衝動や思考の記録データです（JSON配列）。
各記録には、状況・浮かんだ感覚（タグ）・補足・直後の点数（衝動的な瞬間の自己評価）・本当の点数（冷静な自己評価）・次にどうするか、が含まれます。

このデータ全体を分析し、以下の観点で日本語でまとめてください：
1. 頻度の高い「感覚」タグとその傾向
2. 「直後の点数」と「本当の点数」のギャップの傾向（大きい時・小さい時に何が起きているか）
3. 時間帯や状況に見られる共通パターン（データから読み取れる範囲で）
4. 次の一手（これからどうするか）がうまく機能していそうか
5. 全体を通じての気づきや、次に試してみると良さそうなこと

根拠のない断定は避け、データから読み取れる範囲であることを明示してください。
文章は日本語で、語尾は必ず「〜でやんす」の形にしてください（例:「多いでやんすね」「〜という傾向があるでやんす」）。
見出しなどのMarkdown記号（#や**）は使わず、プレーンテキストで、300〜500字程度にまとめてください。`;

    try {
      const response = await fetch("https://bwlogproxy.ooyama381.workers.dev", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [
            { role: "user", content: JSON.stringify(dataForPrompt) }
          ]
        })
      });

      const data = await response.json();
      const textBlocks = (data.content || [])
        .filter(item => item.type === "text")
        .map(item => item.text);

      if (!textBlocks.length){
        throw new Error("no text in response");
      }

      analyzeResult.className = '';
      analyzeResult.textContent = textBlocks.join('\n');
    } catch (err) {
      console.error(err);
      analyzeResult.className = 'error';
      analyzeResult.textContent = '分析に失敗したでやんす。時間を置いてもう一度試すでやんす。';
    } finally {
      analyzeBtn.disabled = false;
    }
  });
</script>

</body>
</html>
